name: MenuGit
options:
  deploymentTarget:
    macOS: '13.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.9'
    DEVELOPMENT_LANGUAGE: zh_CN
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
targets:
  MenuGitCore:
    type: framework
    platform: macOS
    sources: [Sources/MenuGitCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.menugit.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
  MenuGitFinder:
    type: app-extension
    platform: macOS
    sources: [Sources/MenuGitFinder]
    info:
      path: Resources/FinderInfo.plist
      properties:
        CFBundleDisplayName: MenuGit
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
          NSExtensionAttributes: {}
    entitlements:
      path: Resources/Finder.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.temporary-exception.files.absolute-path.read-only:
          - /Users/
          - /System/Volumes/Data/Users/
          - /Volumes/
          - /private/tmp/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.menugit.native.finder
        SKIP_INSTALL: YES
  MenuGit:
    type: application
    platform: macOS
    sources:
      - path: Sources/MenuGitApp
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - target: MenuGitCore
      - target: MenuGitFinder
        embed: true
    info:
      path: Resources/AppInfo.plist
      properties:
        CFBundleDisplayName: MenuGit
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        CFBundleIconFile: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: MenuGit Finder Actions
            CFBundleURLSchemes: [menugit-native]
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.menugit.native
        PRODUCT_NAME: MenuGit
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  MenuGit:
    build:
      targets:
        MenuGit: all
