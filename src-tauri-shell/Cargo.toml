[package]
name = "menugit-shell"
version = "0.1.0"
edition = "2021"
description = "MenuGit Windows 资源管理器右键菜单 COM Shell 扩展（最小技术验证）"

[lib]
# COM 进内组件必须是 cdylib（生成 DLL）
crate-type = ["cdylib"]

[dependencies]
# 注1：windows 0.59+ 已移除 implement feature——#[implement] 宏由 windows-core 始终提供
# 注2：宏展开代码以 `::windows_core::` 绝对路径引用，必须把 windows-core 声明为直接依赖
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
