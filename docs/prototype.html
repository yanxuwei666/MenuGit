<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MenuGit 交互原型</title>
<style>
  :root{
    --accent:#0067c0; --accent-soft:#e8f1fb;
    --ink:#1b1f27; --ink2:#5b6270; --ink3:#8b93a3;
    --line:#e3e6ec; --bg:#eef0f4; --card:#fff;
    --ok:#1a7f4b; --ok-soft:#e6f4ec;
    --warn:#b7791f; --warn-soft:#fdf3e0;
    --bad:#c0392b; --bad-soft:#fdecea;
    --cf-local:#2563ae; --cf-local-soft:#e8f0fe;
    --cf-remote:#6b4fa3; --cf-remote-soft:#f1ecfa;
    --mono:ui-monospace,"SF Mono",Consolas,Menlo,monospace;
    --radius:8px;
  }
  body[data-os="mac"]{ --accent:#0a84ff; --accent-soft:#e9f2ff; --bg:#e8e9ed; }
  body[data-os="ubuntu"]{ --accent:#e95420; --accent-soft:#fdeee7; --bg:#ebe9e6; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); overflow:hidden; display:flex; flex-direction:column;}
  button{font:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,textarea,select{font:inherit; color:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#c9cdd6;border-radius:4px;}

  /* ───── 顶栏 ───── */
  .topbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:10px 18px;
    background:#171a21; color:#e8eaf0; position:relative; z-index:50;}
  .brand{font-weight:700; font-size:15px; letter-spacing:.3px;}
  .brand small{font-weight:400; color:#9aa2b1; margin-left:8px; font-size:12px;}
  .seg{display:flex; background:#242936; border-radius:8px; padding:3px; gap:2px;}
  .seg button{padding:4px 12px; border-radius:6px; font-size:12.5px; color:#aab1c0;}
  .seg button.on{background:var(--accent); color:#fff;}
  .seg button.tgl.on{background:#3d5a3f; color:#9fe0b0;}
  .topbar .gap{flex:1;}
  .topbar .lab{font-size:12px; color:#9aa2b1;}

  .hint{padding:8px 18px; font-size:13px; color:var(--ink2); background:var(--accent-soft);
    border-bottom:1px solid var(--line);}
  .hint b{color:var(--accent);}

  /* ───── 桌面与文件管理器 ───── */
  .desktop{flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; padding:24px;}
  .fm{width:min(880px,96%); height:min(560px,100%); background:var(--card); border-radius:12px;
    box-shadow:0 18px 50px rgba(15,20,30,.22); display:flex; flex-direction:column; overflow:hidden;
    border:1px solid rgba(0,0,0,.06);}
  .fm-bar{display:flex; align-items:center; height:42px; padding:0 12px; background:#f4f5f8; border-bottom:1px solid var(--line); gap:10px;}
  body[data-os="ubuntu"] .fm-bar{background:#2d2d2d; color:#eee; border-bottom-color:#1d1d1d;}
  body[data-os="mac"] .fm-bar{background:#eceded;}
  .lights{display:flex; gap:7px;}
  .lights i{width:12px; height:12px; border-radius:50%;}
  .lights i:nth-child(1){background:#ff5f57;} .lights i:nth-child(2){background:#febc2e;} .lights i:nth-child(3){background:#28c840;}
  .fm-title{flex:1; text-align:center; font-weight:600; font-size:13.5px; color:var(--ink2);}
  body[data-os="win"] .fm-title{text-align:left;}
  body[data-os="ubuntu"] .fm-title{color:#eee;}
  .wbtns{display:flex; gap:4px;}
  .wbtns span{width:30px; height:24px; display:grid; place-items:center; border-radius:6px; color:var(--ink3); font-size:12px;}
  body[data-os="ubuntu"] .wbtns span{color:#bbb;}
  .wbtns span:hover{background:rgba(0,0,0,.08);}
  .wbtns .x:hover{background:#e81123; color:#fff;}
  .only-mac{display:none;} body[data-os="mac"] .only-mac{display:flex;}
  .only-else{display:flex;} body[data-os="mac"] .only-else{display:none;}

  .fm-path{display:flex; align-items:center; gap:6px; padding:7px 14px; border-bottom:1px solid var(--line);
    color:var(--ink2); font-size:13px; background:#fafbfc;}
  body[data-os="ubuntu"] .fm-path{background:#333; color:#ccc; border-bottom-color:#222;}
  .fm-path .crumb{padding:2px 8px; border-radius:5px;}
  .fm-path .crumb:hover{background:rgba(0,0,0,.06);}
  .repo-pill{margin-left:auto; font-size:12px; color:var(--accent); background:var(--accent-soft);
    border:1px solid color-mix(in srgb,var(--accent) 30%,transparent); padding:2px 10px; border-radius:999px; font-weight:600;}
  body[data-os="ubuntu"] .repo-pill{background:#3d2a22; border-color:#6b4030; color:#ff9d6f;}

  .fm-main{flex:1; display:flex; min-height:0;}
  .fm-side{width:168px; border-right:1px solid var(--line); padding:10px 8px; overflow:auto; background:#f7f8fa;}
  body[data-os="ubuntu"] .fm-side{background:#2b2b2b; border-right-color:#1d1d1d;}
  .fm-side h5{font-size:11.5px; color:var(--ink3); font-weight:600; margin:6px 8px 6px;}
  body[data-os="ubuntu"] .fm-side h5{color:#888;}
  .fm-side a{display:block; padding:5px 10px; border-radius:6px; color:var(--ink2); font-size:13px; text-decoration:none; cursor:default;}
  body[data-os="ubuntu"] .fm-side a{color:#ccc;}
  .fm-side a:hover{background:rgba(0,0,0,.06);}
  .fm-side a.cur{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  body[data-os="ubuntu"] .fm-side a.cur{background:#4a3227; color:#ff9d6f;}

  .fm-files{flex:1; overflow:auto; padding:10px 12px; position:relative;}
  .frow{display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:7px; user-select:none;}
  .frow:hover{background:var(--accent-soft);}
  .frow .ico{font-size:17px; width:22px; text-align:center;}
  .frow .nm{flex:1; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .frow .st{font-size:11px; padding:1px 8px; border-radius:999px; font-weight:600;}
  .stM{background:#e8f0fe; color:#2563ae;} .stA{background:var(--ok-soft); color:var(--ok);}
  .stD{background:var(--bad-soft); color:var(--bad);} .stU{background:#eeeaf8; color:#6b4fa3;}
  .stC{background:var(--bad-soft); color:var(--bad); border:1px solid #efb2aa;}
  .fm-status{display:flex; align-items:center; gap:10px; padding:6px 14px; border-top:1px solid var(--line);
    font-size:12.5px; color:var(--ink2); background:#fafbfc;}
  body[data-os="ubuntu"] .fm-status{background:#2d2d2d; color:#bbb; border-top-color:#1d1d1d;}
  .fm-status .dot{width:7px; height:7px; border-radius:50%; background:var(--ok);}
  .fm-status.conflict .dot{background:var(--bad);}
  .fm-status .warn{color:var(--bad); font-weight:600;}

  /* ───── 右键菜单 ───── */
  .ctx{position:fixed; z-index:200; min-width:200px; background:#fff; color:var(--ink); border:1px solid var(--line);
    border-radius:9px; box-shadow:0 12px 34px rgba(15,20,30,.22); padding:5px; font-size:13.5px; animation:pop .1s;}
  @keyframes pop{from{opacity:0; transform:scale(.97);} to{opacity:1; transform:scale(1);}}
  body[data-os="ubuntu"] .ctx{background:#333; border-color:#222; color:#eee;}
  body[data-os="mac"] .ctx{background:rgba(250,250,252,.92); backdrop-filter:blur(18px);}
  .ci{position:relative; display:flex; align-items:center; gap:9px; padding:6px 12px; border-radius:6px; cursor:pointer; white-space:nowrap;}
  .ci:hover{background:var(--accent); color:#fff;}
  body[data-os="mac"] .ci:hover{background:var(--accent);}
  body[data-os="ubuntu"] .ci:hover{background:#e95420;}
  .ci.dis{color:#b6bac4; pointer-events:none;}
  body[data-os="ubuntu"] .ci.dis{color:#777;}
  .ci.hot{color:var(--bad); font-weight:700;}
  .ci.hot::after{content:"有冲突"; font-size:10px; background:var(--bad); color:#fff; border-radius:999px; padding:0 7px; margin-left:auto; font-weight:600;}
  .ci:hover.hot{color:#fff;}
  .ci .ic{width:17px; text-align:center; font-size:13px;}
  .ci .sub-arrow{margin-left:auto; font-size:11px; opacity:.6;}
  .ci .sep{height:1px; background:var(--line); margin:5px 8px; padding:0;}
  body[data-os="ubuntu"] .ci .sep{background:#484848;}
  .ci.brand-top{border-bottom:1px solid var(--line); margin-bottom:4px; padding-bottom:8px; font-weight:700; color:var(--ink2); pointer-events:none;}
  .ci.brand-top:hover{background:none; color:var(--ink2);}
  body[data-os="ubuntu"] .ci.brand-top{border-color:#484848; color:#aaa;}
  .submenu{display:none; position:absolute; left:100%; top:-6px; min-width:200px; background:#fff; color:var(--ink);
    border:1px solid var(--line); border-radius:9px; box-shadow:0 12px 34px rgba(15,20,30,.22); padding:5px;}
  body[data-os="ubuntu"] .submenu{background:#333; border-color:#222; color:#eee;}
  body[data-os="mac"] .submenu{background:rgba(250,250,252,.92); backdrop-filter:blur(18px);}
  .ci.has-sub:hover .submenu, .ci.has-sub.open .submenu{display:block;}
  .ctx-br{opacity:.55; font-size:12px; font-family:var(--mono); font-weight:500; margin-left:1px;}

  /* ───── 功能窗口 ───── */
  .overlay{position:fixed; inset:0; z-index:300; background:rgba(20,24,32,.36); display:none;
    align-items:center; justify-content:center; backdrop-filter:blur(2px);}
  .overlay.show{display:flex;}
  .mwin{width:min(700px,94vw); max-height:86vh; background:var(--card); border-radius:12px;
    box-shadow:0 24px 70px rgba(10,14,22,.4); display:flex; flex-direction:column; overflow:hidden; animation:pop .14s;}
  .mbar{display:flex; align-items:center; height:44px; padding:0 14px; background:#f4f5f8; border-bottom:1px solid var(--line); flex:none;}
  body[data-os="ubuntu"] .mbar{background:#2d2d2d; color:#eee; border-bottom-color:#1d1d1d;}
  body[data-os="mac"] .mbar{background:#eceded;}
  .mbar .t{flex:1; text-align:center; font-weight:600; font-size:13.5px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  body[data-os="win"] .mbar .t{text-align:left;}
  body[data-os="ubuntu"] .mbar .t{color:#eee;}
  .mbar .x{width:30px; height:26px; border-radius:6px; display:grid; place-items:center; color:var(--ink3); font-size:14px;}
  body[data-os="ubuntu"] .mbar .x{color:#bbb;}
  .mbar .x:hover{background:#e81123; color:#fff;}
  .mbody{padding:16px 18px; overflow:auto;}

  .btn{padding:7px 18px; border-radius:7px; font-size:13.5px; font-weight:600; background:var(--accent); color:#fff;}
  .btn:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn.ghost{background:transparent; color:var(--ink2); border:1px solid var(--line); font-weight:500;}
  .btn.ghost:hover{background:rgba(0,0,0,.05); filter:none;}
  .btn.sm{padding:3px 10px; font-size:12px; border-radius:6px;}
  .btn.danger{background:var(--bad);}
  .btn.ok{background:var(--ok);}

  .hint-bar{background:var(--warn-soft); color:var(--warn); border:1px solid #ecd9b4; border-radius:8px;
    padding:8px 12px; font-size:13px; margin-bottom:12px;}
  .hint-bar.red{background:var(--bad-soft); color:var(--bad); border-color:#efb2aa;}

  .stat-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; font-size:13px; color:var(--ink2);}
  .b-pill{background:var(--accent-soft); color:var(--accent); font-weight:700; border-radius:6px; padding:2px 10px; font-size:12.5px;}
  .ab{font-weight:600;} .ab.up{color:var(--ok);} .ab.down{color:var(--accent);}

  .fx-filter{width:100%; padding:6px 12px; border:1px solid var(--line); border-radius:7px; font-size:13px; margin-bottom:10px; background:#fafbfc;}
  .fx-filter:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent); border-color:var(--accent);}

  .file-list{border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-bottom:12px;}
  .f-li{display:flex; align-items:center; gap:9px; padding:8px 12px; border-bottom:1px solid var(--line); font-size:13.5px; cursor:pointer;}
  .f-li:last-child{border-bottom:none;}
  .f-li:hover{background:#f6f8fb;}
  .f-li.sel{background:var(--accent-soft);}
  .f-li.resolved{background:var(--ok-soft);}
  .f-li .nm{flex:1; font-family:var(--mono); font-size:12.5px; word-break:break-all;}
  .f-li .stat{font-size:12px; color:var(--ink3); font-family:var(--mono);}
  .f-li .acts{display:flex; gap:6px;}
  input[type=checkbox]{width:15px; height:15px; accent-color:var(--accent); cursor:pointer;}
  input[type=checkbox]:disabled{cursor:not-allowed;}
  .chk-all{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink2); padding:0 2px 8px;}
  .c-cols{display:flex; gap:14px; margin-bottom:12px; align-items:stretch;}
  .c-left{width:290px; flex:none; min-width:0;}
  .c-right{flex:1; min-width:0; display:flex; flex-direction:column;}
  .c-left .file-list{max-height:300px; overflow:auto; margin-bottom:0;}
  .c-right .diff{flex:1; max-height:none; margin-bottom:0;}
  .diff-title{font-size:12px; color:var(--ink3); padding:0 2px 6px; display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:24px;}
  .diff-title b{color:var(--ink2); font-family:var(--mono); font-size:12px; word-break:break-all;}
  .fsec{border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:12px;}
  .fsec h5{margin:0 0 8px; font-size:12px; color:var(--ink3); font-weight:600;}
  .frow2{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .frow2:last-child{margin-bottom:0;}
  .frow2 label{width:64px; flex:none; font-size:12.5px; color:var(--ink2); text-align:right;}
  .frow2 .fx-filter{margin:0;}

  .diff{background:#fbfbfd; border:1px solid var(--line); border-radius:9px; padding:8px 0;
    font-family:var(--mono); font-size:12.5px; line-height:1.55; margin-bottom:12px; overflow:auto; max-height:220px;}
  .diff .ln{padding:0 14px; white-space:pre-wrap; word-break:break-all;}
  .diff .add{background:#e6f4ec; color:#145c34;}
  .diff .del{background:#fdecea; color:#a03227;}
  .diff .hunk{color:#2563ae; background:#eef3fd; font-size:11.5px;}
  .diff .ctxl{color:var(--ink2);}
  .diff .ch{background:#fdecea; color:var(--bad); font-weight:700;}
  .diff .cs{background:#fdf3e0; color:var(--warn); font-weight:700;}
  .diff .ct{background:#fdecea; color:var(--bad); font-weight:700;}
  .diff-empty{color:var(--ink3); font-size:12.5px; text-align:center; padding:18px 0;}

  /* ───── 解决冲突工作台 ───── */
  .cf-body{height:calc(86vh - 84px); min-height:480px; display:flex; flex-direction:column;
    gap:10px; position:relative;}
  .cf-head{flex:none;}
  .cf-head-row{display:flex; align-items:flex-start; gap:14px;}
  .cf-title{display:flex; gap:11px; min-width:0;}
  .cf-warn{width:34px; height:34px; flex:none; border-radius:9px; display:grid; place-items:center;
    background:var(--warn-soft); color:var(--warn); font-weight:800; font-size:17px; border:1px solid #ecd9b4;}
  .cf-title h3{font-size:16.5px; line-height:1.35;}
  .cf-title p{font-size:12px; color:var(--ink3); margin-top:2px;}
  .cf-title code{font-family:var(--mono); font-size:11.5px; color:var(--ink2); background:#f3f4f8;
    padding:0 5px; border-radius:4px;}
  .cf-bulk{display:flex; align-items:center; gap:6px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end;}
  .cf-bulk .lab{font-size:11.5px; color:var(--ink3); white-space:nowrap;}
  .cf-all-done{font-size:12px; color:var(--ok); font-weight:700;}
  .cf-progress-row{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .cf-progress{flex:1; height:6px; border-radius:999px; background:var(--line); overflow:hidden;}
  .cf-progress i{display:block; height:100%; background:var(--ok); border-radius:999px; transition:width .18s;}
  .cf-progress-row .txt{font-size:12px; color:var(--ink2); white-space:nowrap;}
  .cf-progress-row .txt b{color:var(--ok);}
  .cf-progress-row .remain{font-size:12px; color:var(--ink3); white-space:nowrap;}
  .cf-undo-bar{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink2);
    background:var(--accent-soft); border:1px solid #cfe0f5; border-radius:7px; padding:5px 10px; flex:none;}
  .cf-undo-bar b{color:var(--ink);}
  .cf-undo-bar button{color:var(--accent); font-weight:700; font-size:12px;}
  .cf-undo-bar button:hover{text-decoration:underline;}

  .cf-workspace{flex:1; min-height:0; display:flex; border:1px solid var(--line); border-radius:10px;
    overflow:hidden; background:#fff;}
  .cf-side{width:280px; flex:none; display:flex; flex-direction:column; border-right:1px solid var(--line);
    background:#f7f8fa; min-height:0;}
  .cf-side-head{display:flex; align-items:center; gap:7px; padding:10px 12px;
    border-bottom:1px solid var(--line); flex:none;}
  .cf-side-head b{font-size:12.5px; color:var(--ink2);}
  .cf-side-head span{font-size:11px; color:var(--ink3);}
  .cf-side-list{flex:1; overflow:auto; padding:5px;}
  .cf-file{display:flex; align-items:center; gap:8px; padding:7px 8px; border:1px solid transparent;
    border-radius:7px; cursor:pointer;}
  .cf-file:hover{background:#eef3fa;}
  .cf-file.sel{background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 28%,transparent);}
  .cf-file.done .cf-file-name{color:var(--ink2);}
  .cf-ext{width:32px; height:26px; flex:none; border-radius:5px; display:grid; place-items:center;
    font-family:var(--mono); font-size:9px; font-weight:800; letter-spacing:.2px;
    background:#eceff4; color:var(--ink3); border:1px solid var(--line);}
  .cf-file.sel .cf-ext{background:#fff; color:var(--accent); border-color:#cfe0f5;}
  .cf-file.done .cf-ext{background:var(--ok-soft); color:var(--ok); border-color:#bfe3ce;}
  .cf-file-main{flex:1; min-width:0;}
  .cf-file-name{font-family:var(--mono); font-size:11.5px; line-height:1.45; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .cf-file-meta{font-size:10.5px; color:var(--ink3); display:flex; align-items:center; gap:5px; line-height:1.4;}
  .cf-file-meta .bin{color:var(--warn); font-weight:600;}
  .cf-state{font-size:10px; font-weight:700; padding:1px 6px; border-radius:999px; white-space:nowrap; flex:none;}
  .cf-state.pending{background:var(--bad-soft); color:var(--bad);}
  .cf-state.done{background:var(--ok-soft); color:var(--ok);}
  .cf-side-tip{flex:none; padding:8px 11px; border-top:1px solid var(--line); font-size:10.5px;
    color:var(--ink3); line-height:1.5; background:#f2f4f8;}

  .cf-main{flex:1; min-width:0; display:flex; flex-direction:column; min-height:0;}
  .cf-main-head{flex:none; display:flex; align-items:flex-start; gap:10px; padding:10px 14px;
    border-bottom:1px solid var(--line); background:#fff; flex-wrap:wrap;}
  .cf-main-title{flex:1 1 220px; min-width:0;}
  .cf-main-title h4{font-family:var(--mono); font-size:12.5px; line-height:1.5; word-break:break-all;}
  .cf-main-title p{font-size:11px; color:var(--ink3); margin-top:1px;}
  .cf-main-actions{display:flex; align-items:center; gap:6px; flex:none; flex-wrap:wrap; justify-content:flex-end;}
  .cf-scroll{flex:1; overflow:auto; padding:12px 14px; background:#fbfbfd;}
  .cf-empty{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; color:var(--ink3); font-size:12.5px; text-align:center; padding:30px;}
  .cf-empty .big{font-size:30px; opacity:.4;}

  /* 合并结果：每个文件只有一个编辑区，冲突块内联采用 */
  .cf-editor-card{flex:1; min-height:0; display:flex; flex-direction:column; margin:10px 12px;
    border:1px solid var(--line); border-radius:9px; overflow:hidden; background:#fff;}
  .cf-editor-card:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,transparent);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent);}
  .cf-editor-shell{flex:1; min-height:0; display:flex; background:#fff;}
  .cf-editor-gutter{flex:none; width:46px; padding:10px 8px 10px 0; overflow:hidden;
    background:#f7f8fa; border-right:1px solid var(--line); color:#aeb4c0;
    font-family:var(--mono); font-size:11.5px; line-height:20px; text-align:right; user-select:none;}
  .cf-editor-gutter>div{white-space:pre; will-change:transform;}

/* ══════════ FM-02 提交主窗口 ══════════ */
let commitSel = null, commitFilter = '', commitChecked = {}, commitMsg = '', retCommit = false;
function defChecked(f){
  if (f.st==='C') return false;
  if (f.st==='A' || f.st==='U') return S.settings.checkNew;
  return true;
}
function commitStats(f){
  if (f.st==='D') return '';
  const n = (f.name.length * 7) % 40 + 6;
  return f.st==='D' ? '' : ('+'+n + (f.st!=='A'&&f.st!=='U' ? ' −'+(n%9+1) : ''));
}
function openWinCommit(reset=true){
  if (!busy()) return;
  if (reset){ commitSel = null; commitFilter = ''; commitChecked = {}; commitMsg = ''; }
  openWin('提交 · my-project', '<div id="commitBody"></div>', 'min(940px,94vw)');
  renderCommitBody();
}
function renderCommitBody(){
  const el = $('#commitBody'); if (!el) return;
  const sync = S.ahead>0 ? '领先 origin/'+S.branch+' '+S.ahead+' 个提交' : (S.behind>0 ? '落后 '+S.behind : '与 origin/'+S.branch+' 同步');
  let html = '<div class="stat-head"><span class="b-pill" style="cursor:pointer" title="点击切换或新建分支，提交将落在所选分支上" onclick="openWinBranch(true)">'+ICON_BRANCH+' '+esc(S.branch)+' ▾</span><span class="ab up">'+sync+'</span>';
  if (S.ahead>0 && !S.conflict) html += '<button class="btn sm" id="cPushBtn" style="margin-left:auto">↑ 推送</button>';
  else if (!S.conflict) html += '<span style="margin-left:auto;color:var(--ok);font-weight:600;font-size:12.5px">✔ 已同步</span>';
  html += '</div>';
  if (S.conflict) html += '<div class="hint-bar red">存在 '+S.conflict.files.length+' 个冲突文件，请先 <a class="link" onclick="openWinConflict()">解决冲突</a> 再提交。</div>';
  const list = S.files.filter(f => f.name.includes(commitFilter));
  S.files.forEach(f => { if (!(f.name in commitChecked)) commitChecked[f.name] = defChecked(f); });
  if (!S.files.length){
    html += '<div class="empty"><div class="big">✔</div>工作区干净，'+ (S.ahead>0 ? '领先 origin/'+S.branch+' '+S.ahead+' 个提交，点击右上角「↑ 推送」发布' : '与 origin/'+S.branch+' 同步，等待下一次修改')+'</div>';
  } else {
    html += '<input class="fx-filter" id="cFilter" placeholder="按文件名过滤…" value="'+esc(commitFilter)+'">';
    const sel0 = list.filter(f=>f.st!=='C');
    const allOn = sel0.length>0 && sel0.every(f=>commitChecked[f.name]);
    html += '<label class="chk-all"><input type="checkbox" id="cAll" '+(allOn?'checked':'')+'>全选（Ctrl+A）'+(sel0.length!==list.length?'，不含冲突文件':'')+'</label>';
    html += '<div class="c-cols"><div class="c-left">';
    html += '<div class="file-list">' + list.map(f=>{
      const dis = f.st==='C' ? 'disabled title="冲突文件不可提交"' : '';
      return '<div class="f-li'+(commitSel===f.name?' sel':'')+'" data-f="'+esc(f.name)+'">'+
        '<input type="checkbox" data-chk="'+esc(f.name)+'" '+(commitChecked[f.name]?'checked':'')+' '+dis+'>'+
        '<span class="st '+ST[f.st][1]+'">'+ST[f.st][0]+'</span>'+
        '<span class="nm">'+esc(f.name)+'</span><span class="stat">'+commitStats(f)+'</span></div>';
    }).join('') + '</div>';
    html += '</div><div class="c-right">';
    const selFile = commitSel && S.files.find(f=>f.name===commitSel);
    html += '<div class="diff-title">' + (selFile
      ? '<b>'+esc(selFile.name)+'</b><span>'+ (selFile.st==='D' ? '文件已删除' : commitStats(selFile)) +'</span>'
      : '<span>差异预览</span>') + '</div>';
    html += selFile ? diffHTML(diffOf(selFile.name)) : '<div class="diff"><div class="diff-empty">点击左侧文件查看差异</div></div>';
    html += '</div></div>';
    html += '<textarea class="msg-box" id="cMsg" placeholder="提交信息（必填）…">'+esc(commitMsg)+'</textarea><div class="soft-hint" id="cHint" style="display:none">提示：首行建议不超过 50 字符（不强制）</div>';
    html += '<div class="win-foot"><span class="author">作者：yxw &lt;yxw@example.com&gt;（来自系统 Git 配置）</span>'+
      '<button class="btn ghost" data-close>取消</button><button class="btn" id="cBtn" disabled>提交</button></div>';
  }
  el.innerHTML = html;
  const cf = $('#cFilter');
  if (cf) cf.oninput = e => { commitFilter = e.target.value; renderCommitBody(); };
  const msg = $('#cMsg');
  if (msg){
    msg.oninput = e => {
      commitMsg = e.target.value;
      $('#cHint').style.display = commitMsg.split('\n')[0].length > 50 ? 'block' : 'none';
      updateCommitBtn();
    };
    updateCommitBtn();
  }
  el.querySelectorAll('[data-chk]').forEach(c => c.onchange = () => { commitChecked[c.dataset.chk] = c.checked; updateCommitBtn(); });
  const cAll = $('#cAll');
  if (cAll) cAll.onchange = () => {
    list.forEach(f => { if (f.st!=='C') commitChecked[f.name] = cAll.checked; });
    el.querySelectorAll('[data-chk]').forEach(c => { const f = S.files.find(x=>x.name===c.dataset.chk); if (f && f.st!=='C') c.checked = cAll.checked; });
    updateCommitBtn();
  };
  el.onkeydown = e => {
    if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='a' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
      const box = $('#cAll');
      if (box){ e.preventDefault(); box.checked = !box.checked; box.onchange(); }
    }
  };
  el.querySelectorAll('[data-f]').forEach(n => n.onclick = e => {
    if (e.target.type === 'checkbox') return;
    commitSel = n.dataset.f; renderCommitBody();
  });
  const pb = $('#cPushBtn');
  if (pb) pb.onclick = () => doPush(true);
  const go = $('#cBtn');
  if (go) go.onclick = doCommit;
}
function updateCommitBtn(){
  const btn = $('#cBtn'); if (!btn) return;
  const n = checkedCount();
  const msg = (commitMsg||'').trim();
  btn.disabled = n===0 || !msg || !!S.conflict;
  btn.textContent = n ? '提交 '+n+' 个文件' : '提交';
  const box = $('#cAll');
  if (box){
    const sel = S.files.filter(f=>f.st!=='C');
    const on = sel.filter(f=>commitChecked[f.name]).length;
    box.checked = sel.length>0 && on===sel.length;
    box.indeterminate = on>0 && on<sel.length;
  }
}
function checkedCount(){
  const boxes = document.querySelectorAll('#commitBody [data-chk]');
  return [...boxes].filter(b=>b.checked).length;
}
async function doCommit(){
  if (!busy()) return;
  const msg = (commitMsg||'').trim();
  const names = [...document.querySelectorAll('#commitBody [data-chk]')].filter(b=>b.checked).map(b=>b.dataset.chk);
  if (!names.length || !msg || S.conflict) return;
  const btn = $('#cBtn'); btn.disabled = true; btn.textContent = '提交中…';
  S.busy = true; await sleep(800); S.busy = false;
  const h = randHash();
  LOG.forEach(c => c.heads = c.heads.filter(x=>x!=='HEAD' && x!==S.branch));
  LOG.unshift({h, m:msg.split('\n')[0], a:'yxw', t:'刚刚', files:names, heads:['HEAD',S.branch]});
  S.files = S.files.filter(f => !names.includes(f.name));
  S.ahead++;
  toast('已提交 <b>'+h+'</b> · '+names.length+' 个文件','ok');
  commitSel = null; commitChecked = {}; commitMsg = '';
  renderFm(); renderCommitBody();
  openWinPush(S.files.length > 0);
}

async function pullFrom(src){

  await sleep(900);

    if (BR_LOCAL.includes(v)){ err.textContent='分支已存在'; err.style.display='block'; return; }
    err.style.display='none';
    BR_LOCAL.push(v); switchBranch(v, false, true);
  };

function relabelBranch(newBr, isNew){
  const all = LOG.concat(LOG_OTHER);
  const headC = all.find(c => c.heads.includes('HEAD'));
  if (!headC) return;
  all.forEach(c => c.heads = c.heads.filter(x => x!=='HEAD'));
  if (isNew){ headC.heads.unshift('HEAD', newBr); return; }
  const tgt = all.find(c => c.heads.includes(newBr) || c.heads.includes('origin/'+newBr));
  if (tgt && !tgt.heads.includes('HEAD')) tgt.heads.unshift('HEAD');
  else if (!tgt) headC.heads.unshift('HEAD', newBr);
}
async function switchBranch(name, isRemote, isNew){
  if (!busy()) return;
  if (isRemote) name = name.replace('origin/','');
  relabelBranch(name, isNew);
  S.busy = true; await sleep(500); S.busy = false;
  S.branch = name;
  toast(isNew ? '已创建并切换到 <b>'+esc(name)+'</b>' : (isRemote ? '已检出并跟踪 <b>'+esc(name)+'</b>' : '已切换到 <b>'+esc(name)+'</b>'), 'ok');
  renderFm();
  if (retCommit){ closeWin(); return; }
  if ($('#brBody')) renderBranchBody();
  if ($('#commitBody')) renderCommitBody();
  if ($('#logBody')) renderLogBody();
}

/* ══════════ FM-08 解决冲突 ══════════ */
let cfView = null;
let cfConfirm = null;   // 'local' | 'remote' | 'abort'
let cfUndo = null;      // 批量采用的撤销快照
let cfMessage = '';
const CF_LINE_H = 20, CF_PAD_TOP = 10;

function cfInfo(f){ return CONF_FILES[f] || { hunks:[] }; }
function cfParseBlocks(text){
  const lines = String(text == null ? '' : text).split('\n');
  const out = [];
  let cur = null;
  lines.forEach((ln,i)=>{
    if (/^[ \t]*<<<<<<<(\s|$)/.test(ln)){
      cur = { top:i, localStart:i+1, sep:-1, bottom:-1 };
    } else if (cur && cur.sep < 0 && /^[ \t]*=======\s*$/.test(ln)){
      cur.sep = i;
    } else if (cur && cur.sep >= 0 && /^[ \t]*>>>>>>>(\s|$)/.test(ln)){
      cur.bottom = i;
      out.push(cur);
      cur = null;
    }
  });
  return out;
}
function cfMarkerCount(text){
  return (String(text == null ? '' : text).match(/^[ \t]*(<<<<<<<|>>>>>>>)(?=\s|$)/gm) || []).length;
}
function cfHasEdited(f){ return !!(S.conflict && S.conflict.edited && S.conflict.edited[f] != null); }
function cfResultText(f){
  if (cfHasEdited(f)) return String(S.conflict.edited[f]);
  return mergedLines(f).join('\n');
}
function cfDone(f){
  if (!S.conflict) return false;
  const info = cfInfo(f), ch = S.conflict.choices[f] || [];
  if (info.binary) return !!ch[0];
  return cfMarkerCount(cfResultText(f)) === 0;
}
function cfCount(f){
  const info = cfInfo(f);
  if (info.binary) return 1;
  return cfParseBlocks(cfResultText(f)).length;
}
function cfPending(){ return S.conflict ? S.conflict.files.filter(f=>!cfDone(f)) : []; }
function cfSyncResolved(){
  if (!S.conflict) return;
  S.conflict.files.forEach(f=>{
    if (cfDone(f)) S.conflict.resolved.add(f); else S.conflict.resolved.delete(f);
  });
}
function cfExt(f){
  const base = f.split('/').pop();
  if (base === '.gitignore') return 'GIT';
  const parts = base.split('.');
  if (parts.length < 2) return 'FILE';
  const ext = parts.pop().toUpperCase();
  return ext.length > 4 ? ext.slice(0, 4) : ext;
}
function cfNext(after){
  if (!S.conflict) return null;
  const files = S.conflict.files;
  const start = after ? files.indexOf(after) + 1 : 0;
  for (let n=0; n<files.length; n++){
    const f = files[(start+n) % files.length];
    if (!cfDone(f)) return f;
  }
  return null;
}
function mergedLines(f){
  const out = [];
  (cfInfo(f).hunks || []).forEach(hk=>{
    out.push(...hk.ctxBefore,
      '<<<<<<< 本地 '+S.branch, ...hk.local,
      '=======', ...hk.remote,
      '>>>>>>> 远端 origin/'+S.branch,
      ...hk.ctxAfter);
  });
  return out;
}
function cfWholeLines(f, side){
  const out = [];
  (cfInfo(f).hunks || []).forEach(hk=>{
    out.push(...hk.ctxBefore, ...(side === 'local' ? hk.local : hk.remote), ...hk.ctxAfter);
  });
  return out;
}

function openWinConflict(){
  if (!S.conflict){ toast('当前没有冲突'); return; }
  cfConfirm = null; cfUndo = null;
  if (!S.conflict.edited) S.conflict.edited = {};
  cfView = cfNext(null) || S.conflict.files[0] || null;
  cfMessage = "Merge branch 'origin/"+S.branch+"' into "+S.branch;
  openWin('解决冲突 · my-project', '<div id="cfBody" class="cf-body"></div>', 'min(1180px,96vw)');
  $('#mwin').classList.add('cf-win');
  renderConflictBody();
}

function cfDropUndo(){
  if (!cfUndo) return;
  cfUndo = null;
  const bar = $('.cf-undo-bar');
  if (bar) bar.remove();
}

/* ── 单一结果编辑器：冲突块着色，标记行内联采用 ── */
function cfMetaFromText(text){
  const s = String(text == null ? '' : text);
  const lines = s.split('\n');
  const blocks = cfParseBlocks(s).length;
  const bad = cfMarkerCount(s);
  return {
    blocks, bad,
    stat: lines.length+' 行 · '+s.length+' 字符'+
      (bad ? ' · '+(blocks ? blocks+' 处冲突未解决' : '冲突标记未删除') : ''),
    hint: bad ? '删除全部冲突标记后自动标记为已解决' : '内容会原样写入该文件',
  };
}
function cfBandsHTML(blocks){
  const out = [];
  blocks.forEach(b=>{
    out.push('<i class="cf-band marker" data-line="'+b.top+'" style="height:'+CF_LINE_H+'px"></i>');
    if (b.sep > b.localStart){
      out.push('<i class="cf-band local" data-line="'+b.localStart+'" style="height:'+((b.sep-b.localStart)*CF_LINE_H)+'px"></i>');
    }
    out.push('<i class="cf-band marker" data-line="'+b.sep+'" style="height:'+CF_LINE_H+'px"></i>');
    if (b.bottom > b.sep+1){
      out.push('<i class="cf-band remote" data-line="'+(b.sep+1)+'" style="height:'+((b.bottom-b.sep-1)*CF_LINE_H)+'px"></i>');
    }
    out.push('<i class="cf-band marker" data-line="'+b.bottom+'" style="height:'+CF_LINE_H+'px"></i>');
  });
  return out.join('');
}
function cfActionsHTML(blocks){
  return blocks.map((b,i)=>
    '<div class="cf-conflict-actions" data-block="'+i+'" data-line="'+b.top+'">'+
      '<span class="lead">采用</span>'+
      '<button type="button" class="local" data-cf-side="local" title="采用本地（'+esc(S.branch)+'）的这一段">本地</button>'+
      '<button type="button" class="remote" data-cf-side="remote" title="采用远端（origin/'+esc(S.branch)+'）的这一段">远端</button>'+
      '<button type="button" class="both" data-cf-side="both" title="本地与远端两段都保留">两者</button>'+
    '</div>'
  ).join('');
}
function cfSyncEditorScroll(){
  const a = $('#cfResultArea'); if (!a) return;
  const gutter = $('#cfResultGutter');
  if (gutter) gutter.style.transform = 'translateY('+(-a.scrollTop)+'px)';
  document.querySelectorAll('#cfBandLayer [data-line]').forEach(el=>{
    el.style.top = (CF_PAD_TOP + (+el.dataset.line)*CF_LINE_H - a.scrollTop)+'px';
  });
  document.querySelectorAll('#cfActionLayer [data-block]').forEach(el=>{
    el.style.top = (CF_PAD_TOP + (+el.dataset.line)*CF_LINE_H - a.scrollTop + 1)+'px';
  });
}
function cfDecorateEditor(f){
  const a = $('#cfResultArea'); if (!a) return;
  const text = a.value, lines = text.split('\n'), blocks = cfParseBlocks(text);
  const gutter = $('#cfResultGutter');
  if (gutter) gutter.textContent = Array.from({length:lines.length},(_,i)=>i+1).join('\n');
  const bands = $('#cfBandLayer');
  if (bands) bands.innerHTML = cfBandsHTML(blocks);
  const actions = $('#cfActionLayer');
  if (actions){
    actions.innerHTML = cfActionsHTML(blocks);
    actions.querySelectorAll('[data-cf-side]').forEach(n=>{
      n.onclick = e => {
        e.stopPropagation();
        cfApplyConflict(f, +n.parentElement.dataset.block, n.dataset.cfSide);
      };
    });
  }
  cfSyncEditorScroll();
}
function cfRenderEditor(f){
  const text = cfResultText(f);
  const lines = text.split('\n');
  const blocks = cfParseBlocks(text);
  const meta = cfMetaFromText(text);
  return '<div class="cf-editor-card">'+
    '<div class="cf-editor-shell">'+
      '<div class="cf-editor-gutter"><div id="cfResultGutter">'+
        Array.from({length:lines.length},(_,i)=>i+1).join('\n')+'</div></div>'+
      '<div class="cf-editor-code">'+
        '<div class="cf-band-layer" id="cfBandLayer">'+cfBandsHTML(blocks)+'</div>'+
        '<div class="cf-action-layer" id="cfActionLayer">'+cfActionsHTML(blocks)+'</div>'+
        '<textarea class="cf-result-area" id="cfResultArea" spellcheck="false" autocomplete="off" wrap="off">'+esc(text)+'</textarea>'+
      '</div>'+
    '</div>'+
    '<div class="cf-editor-foot"><span class="cf-editor-stat'+(meta.bad?' bad':'')+'" id="cfResultStat">'+esc(meta.stat)+'</span>'+
      '<span class="spacer"></span><span class="cf-editor-hint" id="cfResultHint">'+esc(meta.hint)+'</span></div>'+
  '</div>';
}
function cfUpdateEditorMeta(){
  const a = $('#cfResultArea'); if (!a) return;
  const meta = cfMetaFromText(a.value);
  const stat = $('#cfResultStat');
  if (stat){ stat.textContent = meta.stat; stat.classList.toggle('bad', !!meta.bad); }
  const hint = $('#cfResultHint');
  if (hint) hint.textContent = meta.hint;
}
function cfOnResultInput(f){
  if (!S.conflict) return;
  const a = $('#cfResultArea'); if (!a) return;
  const wasDone = cfDone(f);
  S.conflict.edited[f] = a.value;
  cfDropUndo();
  cfDecorateEditor(f);
  cfSyncResolved();
  cfRefreshChrome();
  renderStatus();
  if (!wasDone && cfDone(f)) toast('已自动保存 <b>'+esc(f)+'</b> 的最终内容','ok','该文件已标记为已解决');
}
function cfApplyConflict(f, blockIndex, side){
  if (!S.conflict || !f) return;
  const text = cfResultText(f);
  const blocks = cfParseBlocks(text);
  const b = blocks[blockIndex];
  if (!b) return;
  const keep = ($('#cfResultArea') || {}).scrollTop || 0;
  const lines = text.split('\n');
  const local = lines.slice(b.localStart, b.sep);
  const remote = lines.slice(b.sep+1, b.bottom);
  const repl = side === 'local' ? local : side === 'remote' ? remote : local.concat(remote);
  const wasDone = cfDone(f);
  lines.splice(b.top, b.bottom-b.top+1, ...repl);
  S.conflict.edited[f] = lines.join('\n');
  cfDropUndo();
  cfSyncResolved();
  cfView = f;
  renderConflictBody();
  const after = $('#cfResultArea');
  if (after){ after.scrollTop = keep; cfSyncEditorScroll(); }
  renderStatus();
  if (!wasDone && cfDone(f)) toast('已解决 <b>'+esc(f)+'</b>','ok','可继续处理下一个文件');
}
function cfApplyFileSide(f, side){
  if (!S.conflict || !f) return;
  cfUndo = null; cfConfirm = null;
  const info = cfInfo(f);
  if (info.binary) S.conflict.choices[f] = [side];
  else S.conflict.edited[f] = cfWholeLines(f, side).join('\n');
  cfSyncResolved();
  cfView = f;
  toast('已将 <b>'+esc(f)+'</b> 整份采用'+(side==='local'?'本地':'远端')+'版本','ok');
  renderConflictBody(); renderStatus();
}
function cfApplyBulk(side){
  if (!S.conflict) return;
  const targets = cfPending();
  if (!targets.length) return;
  cfUndo = {
    side, files: targets.slice(), view: cfView,
    state: targets.map(f=>{
      const info = cfInfo(f);
      return info.binary
        ? { text: null, bin: (S.conflict.choices[f] || [])[0] || null }
        : { text: cfResultText(f), bin: undefined };
    }),
  };
  targets.forEach(f=>{
    const info = cfInfo(f);
    if (info.binary) S.conflict.choices[f] = [side];
    else S.conflict.edited[f] = cfWholeLines(f, side).join('\n');
  });
  cfSyncResolved();
  cfConfirm = null;
  cfView = targets[0];
  toast('已将 <b>'+targets.length+' 个文件</b>全部采用'+(side==='local'?'本地':'远端')+'版本','ok');
  renderConflictBody(); renderStatus();
}
function cfUndoBulk(){
  if (!cfUndo || !S.conflict) return;
  const snap = cfUndo;
  snap.files.forEach((f,i)=>{
    const st = snap.state[i], info = cfInfo(f);
    if (info.binary){
      if (st.bin) S.conflict.choices[f] = [st.bin];
      else delete S.conflict.choices[f];
    } else {
      S.conflict.edited[f] = st.text;
    }
  });
  cfSyncResolved();
  cfView = S.conflict.files.includes(snap.view) ? snap.view : snap.files[0];
  cfUndo = null;
  toast('已撤销批量采用'+(snap.side==='local'?'本地':'远端')+'版本','ok');
  renderConflictBody(); renderStatus();
}

function cfAbortMerge(){
  if (!S.conflict) return;
  S.files = S.files.filter(f=>f.st!=='C');
  S.conflict = null;
  cfUndo = null; cfConfirm = null;
  toast('已中止合并，恢复到拉取前状态','ok');
  closeWin(); renderFm();
}

async function cfFinish(){
  if (!S.conflict) return;
  const left = cfPending().length;
  if (left){ toast('还有 <b>'+left+'</b> 个冲突文件未解决','warn'); return; }
  if (!busy(false)) return;
  S.busy = true; renderStatus();
  await sleep(600);
  S.busy = false;
  const c = S.conflict;
  const h = randHash();
  const msg = (cfMessage || '').trim() || ("Merge branch 'origin/"+S.branch+"' into "+S.branch);
  LOG.forEach(x => x.heads = x.heads.filter(v=>v!=='HEAD' && v!==S.branch));
  LOG.unshift({h, m:msg.split('\n')[0], a:'yxw', t:'刚刚', files:c.files.slice(), heads:['HEAD',S.branch]});
  S.ahead++;
  S.files = S.files.filter(f=>f.st!=='C');
  S.conflict = null;
  cfUndo = null; cfConfirm = null;
  toast('合并完成，已生成提交 <b>'+h+'</b>（待推送）','ok');
  closeWin(); renderFm();
}

function cfRenderFileList(c){
  return c.files.map(f=>{
    const info = cfInfo(f), done = cfDone(f), n = cfCount(f);
    const meta = info.binary
      ? '<span class="bin">'+(done?'已选择版本':'二进制文件')+'</span>'
      : '<span>'+(done?'结果已保存':(n ? n+' 处冲突' : '冲突标记未清除'))+'</span>';
    return '<div class="cf-file'+(cfView===f?' sel':'')+(done?' done':'')+'" data-cf="'+esc(f)+'">'+
      '<span class="cf-ext">'+esc(cfExt(f))+'</span>'+
      '<div class="cf-file-main"><div class="cf-file-name" title="'+esc(f)+'">'+esc(f)+'</div>'+
      '<div class="cf-file-meta">'+meta+'</div></div>'+
      '<span class="cf-state '+(done?'done':'pending')+'">'+(done?'✓ 已解决':'待解决')+'</span></div>';
  }).join('');
}

function cfRenderBinary(f, info, ch){
  const side = ch[0] || null;
  const opt = (key, label, branch) => {
    const chosen = side === key;
    return '<button class="cf-binary-opt '+key+(chosen?' chosen':'')+'" data-file-side="'+key+'">'+
      '<span class="tag">'+label+'</span><b>'+esc(branch)+'</b>'+
      '<small>'+esc(info.size || '二进制文件')+' · 保留该版本的完整文件</small>'+
      (chosen?'<span class="mark">✓ 已采用</span>':'')+'</button>';
  };
  return '<div class="cf-binary">'+
    '<div class="cf-binary-top"><span class="cf-binary-ic">'+esc(cfExt(f))+'</span>'+
    '<div><h4>二进制文件无法逐行合并</h4><p>请选择保留哪一版。选择后会直接标记为已解决，不能合并两边的内容。</p></div></div>'+
    '<div class="cf-binary-opts">'+opt('local','本地版本', S.branch)+opt('remote','远端版本', 'origin/'+S.branch)+'</div></div>';
}

function cfMainActionsHTML(f){
  const info = cfInfo(f), done = cfDone(f);
  const next = done ? cfNext(f) : null;
  const nextBtn = next ? '<button class="btn sm" data-next-file>下一个待处理 ›</button>' : '';
  if (info.binary) return nextBtn;
  const n = cfCount(f);
  let html = '';
  if (!done && n) html += '<button class="btn sm ghost" data-jump>下一处冲突 ↓</button>';
  html += '<button class="btn sm ghost cf-file-local" data-file-side="local">整份采用本地</button>'+
    '<button class="btn sm ghost cf-file-remote" data-file-side="remote">整份采用远端</button>';
  return html + nextBtn;
}

function cfBulkHTML(pending){
  return pending.length
    ? '<span class="lab">仅未解决文件</span>'+
      '<button class="btn sm ghost" data-bulk="local">全部采用本地</button>'+
      '<button class="btn sm ghost" data-bulk="remote">全部采用远端</button>'
    : '<span class="cf-all-done">✓ 全部冲突已解决</span>';
}

function cfMainStateText(f){
  const info = cfInfo(f), done = cfDone(f);
  if (info.binary) return done ? '已选择保留版本 · 完成合并后生效' : '二进制文件 · 只能选择保留一侧';
  if (done) return '✓ 已解决 · 已自动保存，完成合并后写入';
  const n = cfCount(f), bad = cfMarkerCount(cfResultText(f));
  if (!n && bad) return '还有冲突标记未删除 · 删完标记后自动完成';
  return n+' 处冲突 · 可直接编辑，或点冲突行右侧按钮采用一侧';
}

function cfRenderConfirm(){
  const pending = cfPending();
  if (cfConfirm === 'abort'){
    return '<div class="cf-confirm-layer"><div class="cf-confirm">'+
      '<h4>中止本次合并？</h4>'+
      '<p>所有冲突选择都会被丢弃，仓库会恢复到拉取前的状态。<b>此操作不可撤销。</b></p>'+
      '<div class="cf-confirm-actions"><button class="btn ghost" data-confirm-cancel>继续解决</button>'+
      '<button class="btn danger" id="cfAbortGo">确认中止</button></div></div></div>';
  }
  if (cfConfirm !== 'local' && cfConfirm !== 'remote') return '';
  const side = cfConfirm;
  const blocks = pending.reduce((n,f)=>n+(cfInfo(f).binary?0:cfCount(f)),0);
  const bins = pending.filter(f=>cfInfo(f).binary).length;
  const branch = side==='local' ? esc(S.branch) : 'origin/'+esc(S.branch);
  return '<div class="cf-confirm-layer"><div class="cf-confirm">'+
    '<h4>全部采用'+(side==='local'?'本地':'远端')+'版本？</h4>'+
    '<p>将把剩余 <b>'+pending.length+' 个文件</b>的 <b>'+blocks+' 处冲突</b>全部替换为 <code>'+branch+'</code> 的内容'+
    (bins?'，<b>'+bins+' 个二进制文件</b>整份覆盖':'')+
    '，另一侧的对应修改将被丢弃。完成合并提交前仍可重新编辑。</p>'+
    '<div class="cf-confirm-actions"><button class="btn ghost" data-confirm-cancel>取消</button>'+
    '<button class="btn'+(side==='local'?'':' cf-btn-remote')+'" data-confirm-apply="'+side+'">全部采用'+(side==='local'?'本地':'远端')+'</button></div></div></div>';
}

function renderConflictBody(){
  const el = $('#cfBody'); if (!el) return;
  const c = S.conflict;
  cfSyncResolved();
  const pending = cfPending();
  const total = c.files.length;
  const done = total - pending.length;
  const pct = total ? Math.round(done/total*100) : 0;
  let html = '<div class="cf-head"><div class="cf-head-row">'+
    '<div class="cf-title"><div class="cf-warn">!</div><div><h3>合并冲突</h3>'+
    '<p>拉取 <code>origin/'+esc(S.branch)+'</code> 到 <code>'+esc(S.branch)+'</code> 时产生冲突；直接在结果里编辑或采用某一侧，全部解决后生成一个合并提交。</p></div></div>'+
    '<div class="cf-bulk" id="cfBulk">'+cfBulkHTML(pending)+'</div></div>'+
    '<div class="cf-progress-row"><div class="cf-progress"><i id="cfProgressFill" style="width:'+pct+'%"></i></div>'+
    '<span class="txt" id="cfProgressTxt"><b>'+done+'</b> / '+total+' 个文件已解决</span>'+
    '<span class="remain" id="cfRemainTxt">'+(pending.length?'还有 '+pending.length+' 个待处理':'可以完成合并提交了')+'</span></div></div>';
  if (cfUndo){
    html += '<div class="cf-undo-bar">已将 <b>'+cfUndo.files.length+' 个文件</b>全部采用'+(cfUndo.side==='local'?'本地':'远端')+'版本'+
      '<button data-undo>撤销</button></div>';
  }
  html += '<div class="cf-workspace"><aside class="cf-side">'+
    '<div class="cf-side-head"><b>冲突文件</b><span id="cfSideCount">'+total+' 个 · '+pending.length+' 个待解决</span></div>'+
    '<div class="cf-side-list" id="cfFileList">'+cfRenderFileList(c)+'</div>'+
    '<div class="cf-side-tip">点冲突行右侧按钮可整块采用一侧；也可以直接改结果，所有修改都会自动保存。</div>'+
    '</aside><section class="cf-main">'+cfRenderMain()+'</section></div>';

  html += '<div class="cf-foot"><div class="cf-msg"><label>合并提交信息</label>'+
    '<input id="cfMsg" value="'+esc(cfMessage)+'" spellcheck="false"></div>'+
    '<div class="cf-foot-actions"><span class="cf-foot-hint" id="cfFootHint">'+
    (pending.length?'还有 '+pending.length+' 个文件待解决':'全部冲突已解决')+'</span>'+
    '<button class="btn ghost danger-text" id="cfAbort">中止合并</button>'+
    '<button class="btn'+(pending.length?'':' ok')+'" id="cfDone" '+(pending.length?'disabled':'')+'>完成合并提交</button></div></div>';
  html += cfRenderConfirm();
  el.innerHTML = html;
  bindConflictEvents(el);
}

function cfRenderMain(){
  const f = cfView;
  if (!f || !CONF_FILES[f]){
    return '<div class="cf-empty"><div class="big">⌁</div><div>从左侧选择一个冲突文件开始处理</div></div>';
  }
  const info = cfInfo(f), ch = S.conflict.choices[f] || [];
  let head = '<div class="cf-main-head"><div class="cf-main-title"><h4>'+esc(f)+'</h4>'+
    '<p id="cfMainState">'+cfMainStateText(f)+'</p></div>'+
    '<div class="cf-main-actions" id="cfMainActions">'+cfMainActionsHTML(f)+'</div></div>';
  if (info.binary) return head+'<div class="cf-scroll">'+cfRenderBinary(f, info, ch)+'</div>';
  return head+cfRenderEditor(f);
}

function bindCfFileItems(root){
  root.querySelectorAll('[data-cf]').forEach(n=>{
    n.onclick = () => { cfConfirm = null; cfView = n.dataset.cf; renderConflictBody(); };
  });
}

function cfJumpConflict(){
  const a = $('#cfResultArea'); if (!a) return;
  const blocks = cfParseBlocks(a.value); if (!blocks.length) return;
  const topFor = b => CF_PAD_TOP + b.top*CF_LINE_H;
  const off = a.scrollTop;
  let idx = blocks.findIndex(x => topFor(x) > off + 64);
  if (idx < 0) idx = blocks.findIndex(x => topFor(x) > off + 4);
  if (idx < 0) idx = 0;
  let dest = Math.max(0, topFor(blocks[idx]) - 40);
  if (Math.abs(dest - off) < 6){
    idx = (idx + 1) % blocks.length;
    dest = Math.max(0, topFor(blocks[idx]) - 40);
  }
  a.scrollTop = dest;
  cfSyncEditorScroll();
}
function cfGoNextFile(){
  const f = cfNext(cfView);
  if (!f) return;
  cfConfirm = null; cfView = f;
  renderConflictBody();
}

function bindCfMainActions(root){
  root.querySelectorAll('[data-file-side]').forEach(n=>{
    n.onclick = e => { e.stopPropagation(); cfApplyFileSide(cfView, n.dataset.fileSide); };
  });
  const jump = root.querySelector('[data-jump]');
  if (jump) jump.onclick = cfJumpConflict;
  const next = root.querySelector('[data-next-file]');
  if (next) next.onclick = cfGoNextFile;
}

function bindCfBulk(root){
  root.querySelectorAll('[data-bulk]').forEach(n=>{
    n.onclick = () => { cfConfirm = n.dataset.bulk; renderConflictBody(); };
  });
}

function cfRefreshChrome(){
  if (!S.conflict || !$('#cfBody')) return;
  cfSyncResolved();
  const c = S.conflict, f = cfView;
  const pending = cfPending();
  const total = c.files.length, done = total - pending.length;
  const pct = total ? Math.round(done/total*100) : 0;
  const sideCount = $('#cfSideCount');
  if (sideCount) sideCount.textContent = total+' 个 · '+pending.length+' 个待解决';
  const list = $('#cfFileList');
  if (list){
    const top = list.scrollTop;
    list.innerHTML = cfRenderFileList(c);
    list.scrollTop = top;
    bindCfFileItems(list);
  }
  const fill = $('#cfProgressFill');
  if (fill) fill.style.width = pct+'%';
  const ptxt = $('#cfProgressTxt');
  if (ptxt) ptxt.innerHTML = '<b>'+done+'</b> / '+total+' 个文件已解决';
  const remain = $('#cfRemainTxt');
  if (remain) remain.textContent = pending.length ? '还有 '+pending.length+' 个待处理' : '可以完成合并提交了';
  const bulk = $('#cfBulk');
  if (bulk){ bulk.innerHTML = cfBulkHTML(pending); bindCfBulk(bulk); }
  if (f && CONF_FILES[f]){
    const state = $('#cfMainState');
    if (state) state.textContent = cfMainStateText(f);
    const actions = $('#cfMainActions');
    if (actions){ actions.innerHTML = cfMainActionsHTML(f); bindCfMainActions(actions); }
    cfUpdateEditorMeta();
  }
  const hint = $('#cfFootHint');
  if (hint) hint.textContent = pending.length ? '还有 '+pending.length+' 个文件待解决' : '全部冲突已解决';
  const finish = $('#cfDone');
  if (finish){
    finish.disabled = pending.length > 0;
    finish.classList.toggle('ok', pending.length === 0);
  }
}

function bindConflictEvents(el){
  bindCfFileItems(el);
  bindCfMainActions(el);
  bindCfBulk(el);
  const undo = el.querySelector('[data-undo]');
  if (undo) undo.onclick = cfUndoBulk;
  el.querySelectorAll('[data-confirm-cancel]').forEach(n=>{
    n.onclick = () => { cfConfirm = null; renderConflictBody(); };
  });
  el.querySelectorAll('[data-confirm-apply]').forEach(n=>{
    n.onclick = () => cfApplyBulk(n.dataset.confirmApply);
  });
  const abort = el.querySelector('#cfAbort');
  if (abort) abort.onclick = () => { cfConfirm = 'abort'; renderConflictBody(); };
  const abortGo = el.querySelector('#cfAbortGo');
  if (abortGo) abortGo.onclick = cfAbortMerge;
  const finish = el.querySelector('#cfDone');
  if (finish) finish.onclick = cfFinish;
  const msg = el.querySelector('#cfMsg');
  if (msg) msg.oninput = () => { cfMessage = msg.value; };

  const result = el.querySelector('#cfResultArea');
  if (result){
    result.oninput = () => cfOnResultInput(cfView);
    result.onscroll = cfSyncEditorScroll;
    result.onkeydown = e => {
      if (e.key === 'Tab'){
        e.preventDefault();
        const s = result.selectionStart, en = result.selectionEnd;
        result.value = result.value.slice(0,s)+'  '+result.value.slice(en);
        result.selectionStart = result.selectionEnd = s+2;
        cfOnResultInput(cfView);
      } else if (e.key === 'Escape'){
        e.stopPropagation();
        result.blur();
      }
    };
    cfDecorateEditor(cfView);
  }
}

  function diffContent(name){
    if(!name)return `<div class="mg-diff-box"><div class="mg-diff-title">差异预览</div><div class="diff-empty">选择文件以查看差异。</div></div>`;

    else if(name==='src/app.py')lines='<div class="mg-diff-line hunk">@@ -18,6 +18,8 @@</div><div class="mg-diff-line"> def load_config(path):</div><div class="mg-diff-line del">-    return json.load(open(path))</div><div class="mg-diff-line add">+    with open(path, encoding="utf-8") as source:</div><div class="mg-diff-line add">+        return json.load(source)</div>';

    else if(name==='src/export.py')lines='<div class="mg-diff-line hunk">@@ -1,3 +1,5 @@</div><div class="mg-diff-line"> def export_report(data):</div><div class="mg-diff-line add">+     validate(data)</div><div class="mg-diff-line add">+     write_pdf(data)</div>';
    else lines='<div class="mg-diff-line hunk">@@ -1,3 +1,4 @@</div><div class="mg-diff-line"> # '+esc(name)+'</div><div class="mg-diff-line del">-旧内容</div><div class="mg-diff-line add">+更新后的内容</div>';
    return `<div class="mg-diff-box"><div class="mg-diff-title">${esc(name)} <span style="float:right;color:#8a929e">${label}</span></div>${lines}</div>`;
  }

    if(a==='conflict-bulk'){const scope=btn.dataset.scope||'files',indices=P.conflictFiles.map((f,i)=>f.checked&&!f.resolved&&!f.editing&&(scope!=='chunks'||(!f.binary&&f.chunks.some(c=>!c.choice)))?i:-1).filter(i=>i>=0);if(!indices.length){toastMsg('请先勾选可处理的冲突文件','warn');return}P.bulkConflictIndices=indices;P.bulkConflictChoice=btn.dataset.choice;P.bulkConflictScope=scope;P.modal='bulk-conflict-confirm';render();return}
    if(a==='cancel-bulk-conflict'){P.modal='conflicts';render();return}
    if(a==='confirm-bulk-conflict'){saveConflictUndo();for(const i of P.bulkConflictIndices||[]){const f=P.conflictFiles[i];if(!f||f.resolved||f.editing||!f.checked)continue;if(P.bulkConflictScope==='chunks'){if(f.binary)continue;f.chunks.forEach(c=>{if(!c.choice)c.choice=P.bulkConflictChoice});f.resolved=f.chunks.every(c=>!!c.choice)}else{f.wholeChoice=P.bulkConflictChoice;if(f.binary)f.choice=P.bulkConflictChoice;else f.chunks.forEach(c=>c.choice=P.bulkConflictChoice);f.resolved=true}if(f.resolved)f.checked=false}P.bulkConflictIndices=[];P.modal='conflicts';render();toastMsg(P.bulkConflictScope==='chunks'?'已批量处理未解决冲突块':'已按所选整份版本解决文件','ok');return}
    if(a==='mark-file-resolved'){const f=P.conflictFiles.find(x=>x.name===btn.dataset.file);if(f)f.resolved=true;render();return}
    if(a==='resolve-binary-local'||a==='resolve-binary-incoming'){const f=P.conflictFiles.find(x=>x.name===btn.dataset.file);if(f){f.choice=a==='resolve-binary-local'?'local':'incoming';f.resolved=true}render();return}
    if(a==='continue-merge'){if(!P.conflictFiles.length||P.conflictFiles.some(f=>!f.resolved)){toastMsg('请先解决全部冲突文件','warn');return}const op=P.conflictOperation;if(op==='merge'){const c={hash:Math.random().toString(16).slice(2,9),message:'merge: 合并 '+(P.conflictTarget||P.upstream||('origin/'+P.currentBranch)),author:'yxw',time:'刚刚',files:P.conflictFiles.map(f=>f.name).join(' · ')};P.commits.unshift(c);P.outgoing.unshift(c)}else{const replacements=new Map(P.outgoing.map(c=>[c.hash,{...c,hash:Math.random().toString(16).slice(2,9)}]));P.outgoing=P.outgoing.map(c=>replacements.get(c.hash));P.commits=P.commits.map(c=>replacements.get(c.hash)||c)}P.ahead=P.outgoing.length;P.behind=0;saveBranchState();P.conflict=false;P.conflictFiles=[];P.conflictResolved=false;P.modal='merge-success';render();return}
    if(a==='abort-confirm'){P.modal='abort-confirm';render();return}
    if(a==='cancel-abort'){P.modal='conflicts';render();return}
    if(a==='confirm-abort'){const op=P.conflictOperation;P.conflict=false;P.conflictFiles=[];P.conflictResolved=false;P.conflictDemo=false;P.conflictOnNextPull=P.behind>0;P.modal='';toastMsg(op==='rebase'?'已中止变基':'已中止合并','warn');render();return}
    if(a==='simulate-conflict'){P.conflictOnNextPull=!P.conflictOnNextPull;toastMsg(P.conflictOnNextPull?'已设定：下一次拉取会出现冲突':'已取消冲突模拟','warn');render();return}
    if(a==='open-conflict-demo'){P.conflictDemo=true;P.conflict=true;P.conflictResolved=false;P.conflictOperation='merge';P.conflictFiles=makeConflictFiles();P.conflictSelected=0;P.conflictHunk=0;P.conflictUndo=[];P.modal='conflicts';P.context=false;render();return}
  };
  app.onchange=e=>{const el=e.target;if(el.matches('[data-conflict-check]')){const f=P.conflictFiles[Number(el.dataset.conflictCheck)];if(f&&!f.resolved&&!f.editing)f.checked=el.checked;render();return}if(el.matches('[data-action="conflict-select-all"]')){const q=(P.conflictFilter||'').toLowerCase();P.conflictFiles.forEach(f=>{if(!f.resolved&&!f.editing&&f.name.toLowerCase().includes(q))f.checked=el.checked});render();return}if(el.matches('[data-action="conflict-auto"]')){P.conflictAutoNext=el.checked;return}if(el.id==='mgConflictOperation'){P.conflictOperation=el.value;render();return}if(el.matches('[data-check]')){const f=P.files.find(x=>x.name===el.dataset.check);if(f){f.checked=el.checked;P.selected=f.name}syncHint();render();return}if(el.matches('[data-action="check-all"]')){P.files.forEach(f=>{if(f.status!=='U')f.checked=el.checked});render()}};
  app.oninput=e=>{if(e.target.id==='cfResultEditor'){const f=P.conflictFiles[P.conflictSelected||0];if(f?.editing)f.editDraft=e.target.value;return}if(e.target.id==='cfSearch'){P.conflictFilter=e.target.value;const pos=e.target.selectionStart;render();const next=app.querySelector('#cfSearch');next?.focus();next?.setSelectionRange(pos,pos);return}if(e.target.matches('.mg-message')){P.message=e.target.value;syncHint()}if(e.target.id==='mgSearch'){P.filter=e.target.value;const pos=e.target.selectionStart;render();const next=app.querySelector('#mgSearch');next?.focus();next?.setSelectionRange(pos,pos)}if(e.target.id==='mgCloneUrl'){const name=e.target.value.trim().replace(/\/+$/,'').split('/').pop().replace(/\.git$/,'');const target=app.querySelector('#mgCloneName');if(target)target.value=name}};
  app.onkeydown=e=>{const row=e.target.closest('[data-finder-row]');if(row&&(e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10'))){e.preventDefault();const rect=row.getBoundingClientRect();row.dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:rect.left+Math.min(100,rect.width/2),clientY:rect.top+rect.height/2}));app.querySelector('[data-action="menugit-submenu"]')?.focus();return}const control=e.target.closest('[role="button"][data-action]');if(control&&(e.key==='Enter'||e.key===' ')){e.preventDefault();control.click();if(control.dataset.action==='menugit-submenu')app.querySelector('[data-action="menu"]')?.focus()}};
  app.ondblclick=e=>{const row=e.target.closest('[data-finder-row]');if(row?.dataset.dest){P.finderPrevious=P.finderDir;P.finderDir=row.dataset.dest;P.finderSelected='';P.finderSelection=[];P.context=false;render()}};
  app.oncontextmenu=e=>{if(P.modal||!e.target.closest('#finderContents'))return;e.preventDefault();const row=e.target.closest('[data-finder-row]'),dir=finderDirs[P.finderDir];const selectedName=row?.dataset.finderRow||'';if(!selectedName||!P.finderSelection.includes(selectedName))P.finderSelection=selectedName?[selectedName]:[];P.finderSelected=selectedName;P.finderContextDest=row?.dataset.dest||'';const dest=P.finderContextDest,contextDir=dest||P.finderDir,repoPath=repoForDir(contextDir);P.contextRepo=!!repoPath;P.scene=P.contextRepo?'repo':'norepo';if(repoPath)loadRepo(repoPath);P.contextTargetPath=dest?finderDirs[dest].path:dir.path;const relative=P.contextRepo?P.contextTargetPath.slice(repoPath.length).replace(/^\//,''):'';const selectedFiles=P.contextRepo&&row&&!dest?dir.rows.filter(([name,,child])=>!child&&P.finderSelection.includes(name)).map(([name])=>[relative,name].filter(Boolean).join('/')):[];P.contextFiles=selectedFiles;P.contextDir=P.contextRepo&&!selectedFiles.length?relative:'';P.contextX=e.clientX;P.contextY=e.clientY;P.menugitSubmenu=false;P.context=true;render()};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(P.modal||P.context)){if(P.modal==='clone-progress'){cancelCloneDemo();toastMsg('已取消克隆','warn')}if(P.modal==='conflicts'||P.modal==='abort-confirm')closeConflictDemo();P.modal='';P.context=false;render()}});
  render();
})();
