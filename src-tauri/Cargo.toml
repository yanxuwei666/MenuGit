[package]
name = "menugit"
version = "0.1.0"
edition = "2021"
description = "MenuGit - 轻量级跨平台 Git 右键菜单工具"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
